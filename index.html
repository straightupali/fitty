<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>fitty</title>
  <meta name="description" content="Fitty picks your outfit so you don't have to.">
  <meta name="theme-color" content="#F7F4EF">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the saved theme before the page paints (no white flash in dark mode).
    try {
      var p = localStorage.getItem('fitbud:theme') || 'light';
      var t = p === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p;
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="fitty">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidenav" aria-label="Main">
      <div class="brand">fit<em>ty</em></div>
      <nav class="navlist" id="sidenav"></nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="brand brand-mobile">fit<em>ty</em></div>
        <div id="topbar-right"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>
  <div id="sheets"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="dropveil" class="dropveil" hidden><div>Drop photos on a section</div></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
