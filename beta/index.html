<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fitty</title>
<script>
  // The beta is now part of Fitty 3.0. Tidy up its offline copy, then open the main app,
  // which offers to bring over anything you did in the beta.
  (async () => {
    try {
      const regs = await navigator.serviceWorker?.getRegistrations?.() || [];
      await Promise.all(regs.filter(r => /\/beta\/$/.test(r.scope)).map(r => r.unregister()));
      const keys = await caches?.keys?.() || [];
      await Promise.all(keys.filter(k => k.startsWith('fitty-beta-')).map(k => caches.delete(k)));
    } catch (e) { }
    location.replace('../');
  })();
</script>
</head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding:40px">
  <p>The Fitty beta is now part of the main app.</p>
  <p><a href="../">Open fitty</a></p>
</body>
</html>
